# 长期建图配置文件
# 用于 warehouse_live_longterm_mapping.launch

# 调试选项
debug:
  publish_runtime_path: false  # runtime_path 只是显示辅助，不参与算法
  runtime_diagnostics:
    enabled: true
    # Production console is Cargo/Safety focused. Full localization and timing
    # diagnostics remain available frame-by-frame in CSV.
    console_health_enabled: false
    # Operational terminal is reserved for cargo tracking and safety changes.
    # Localization/pipeline risk samples remain in the per-frame CSV files.
    # NDT/pipeline risk details remain in runtime_frames.csv. Immediate ROS
    # errors (SO3/non-finite/relocalization) are unaffected by this switch.
    console_risk_enabled: false
    cargo_console_enabled: true
    health_period_sec: 10.0
    risk_repeat_period_sec: 10.0
    csv_enabled: true
    output_dir: "/tmp/ndt_slam_runtime_data"
    csv_flush_period_sec: 1.0
    warn_consecutive_overrun_frames: 3
    warn_prediction_only_frames: 3
    warn_target_fallback_frames: 3
    warn_cargo_bottom_jump_m: 0.20
    warn_cargo_height_jump_m: 0.20

# 日志配置
logging:
  summary_interval_sec: 10.0
  warn_throttle_sec: 2.0

  debug_config: false
  debug_frame_start: false
  debug_ndt_health: false
  debug_ekf: false
  debug_motion_gate: false
  debug_pose_flow: false
  debug_map_commit: false
  debug_perf: false          # Per-frame timing stays in runtime_frames.csv.
  debug_cargo: false
  debug_cargo_bottom: false
  debug_cargo_warning: false
  debug_tight_box: false
  debug_dynamic_filter: false
  debug_odom_anchor: false
  debug_registration_removal: false
  debug_hook_removal: false

# 点云话题
pointcloud_topic: "/merged_points"
odom_topic: "/odom"
pose_topic: "/current_pose"
map_topic: "/map"
current_cloud_topic: "/mapping_current_cloud"

# Main localization queue. Capacity 1 is the production latest-frame policy:
# an old frame is overwritten instead of building latency under load.
processing_queue:
  capacity: 1

# 坐标系
odom_frame: "odom"
base_frame: "base_link"
map_frame: "map"

# 发布 TF
publish_tf: true

# 地图参数
map_voxel_size: 0.30
display_voxel_size: 0.10
ground_voxel_size: 0.15
objects_voxel_size: 0.08
max_map_size: 200.0
use_voxel_filter: true
map_update_interval: 1

# 网格地面模型
grid_cell_size: 2.0
height_above_ground: 0.35

# 近场过滤
near_field_radius: 4.0
near_field_z_min: 3.0

# NDT_OMP 配置
ndt_omp:
  resolution: 1.0
  step_size: 0.1
  transformation_epsilon: 0.01
  max_iterations: 30          # v8-stable-r3-hotfix-minimal: 从 50 改为 30，与 adaptive_ndt.normal 一致
  num_threads: 4              # V3: NDT_OMP 多线程加速
  neighbor_search_method: DIRECT7  # V3: DIRECT7 比 KDTREE 快，搜索相同相邻体素集合

# Asynchronous local/global recovery. The live NDT/EKF path continues while a
# latest-only worker searches; two independent results must agree before the
# pose, EKF and Cargo state are switched.
relocalization:
  enabled: true
  trigger_frames: 5
  global_trigger_frames: 15
  confirm_frames: 2
  request_interval_frames: 3
  result_max_age_frames: 8
  result_max_age_sec: 0.50
  # Global search is intentionally slower than the live local search. Keep
  # identity/version validation, but do not discard a valid worker result
  # merely because a bounded whole-map search exceeded 0.5 seconds.
  global_result_max_age_frames: 120
  global_result_max_age_sec: 12.0
  cooldown_frames: 12
  local_max_candidates: 12
  global_max_candidates: 48
  local_xy_window_m: 1.5
  local_xy_step_m: 1.5
  local_yaw_window_deg: 12.0
  local_yaw_step_deg: 12.0
  global_hint_count: 4
  global_min_similarity: 0.55
  confirm_translation_m: 0.35
  confirm_yaw_deg: 5.0
  # A global candidate is only a seed. Existing-map startup and every
  # recovery remain quarantined until 6 of a recent 8-frame window pass. At
  # most two isolated failures are tolerated; temporal rollback/gaps still
  # reset admission. HEALTHY runtime transients use the multi-frame
  # relocalization gate instead of revoking on one weak frame.
  health_required_frames: 8
  health_minimum_qualified_frames: 6
  health_maximum_consecutive_failures: 2
  health_max_fitness: 0.35
  health_max_innovation_m: 0.75
  health_max_frame_gap_sec: 0.50
  min_source_points: 800
  min_target_points: 1200
  # Worker hard cap; each job applies the smaller local/global budget above.
  max_candidates: 64
  max_iterations: 35
  num_threads: 2
  resolution: 1.0
  step_size: 0.20
  transformation_epsilon: 0.01
  target_crop_radius_m: 18.0
  source_voxel_m: 0.30
  target_voxel_m: 0.40
  max_fitness: 2.0
  min_probability: 0.0
  max_local_seed_correction_m: 3.0
  max_local_seed_yaw_correction_deg: 20.0
  max_roll_pitch_deg: 3.0
  max_z_correction_m: 0.50
  # Read-only global consistency validation. It shares the bounded
  # relocalization worker but never mutates odom/EKF unless two independent
  # checks prove that a materially better global solution disagrees.
  global_consistency:
    enabled: true
    periodic_interval_sec: 30.0
    periodic_distance_m: 8.0
    periodic_keyframes: 20
    minimum_request_interval_sec: 10.0
    yaw_reject_trigger_frames: 3
    translation_disagreement_m: 0.30
    yaw_disagreement_deg: 0.60
    minimum_fitness_improvement: 0.05
    maximum_result_age_sec: 12.0
    inconsistent_confirmations: 2
    consistent_confirmations: 2

# 动态点过滤
dynamic_filter:
  enabled: true
  mean_k: 20
  stddev_mul_thresh: 1.5

# 特征提取
feature_extraction:
  enabled: false
  voxel_size: 0.20
  height_diff_threshold: 0.10
  feature_weight: 8

# 闭环检测
loop_closure:
  enabled: true
  detection_interval: 20

scan_context:
  num_rings: 20
  num_sectors: 60
  max_range: 80.0
  spatial_search_radius: 8.0
  similarity_threshold: 0.80
  translation_threshold: 1.0
  rotation_threshold: 10.0
  loop_icp_max_correspondence_m: 1.0
  loop_icp_max_fitness: 0.50
  loop_icp_max_correction_translation_m: 1.0
  loop_icp_max_correction_yaw_deg: 15.0
  global_icp_max_correspondence_m: 1.5
  global_icp_max_fitness: 0.80
  global_icp_max_correction_translation_m: 1.5
  global_icp_max_correction_yaw_deg: 20.0

# ========== 长期建图配置 ==========

# 长期建图模式
longterm_mapping:
  enabled: true
  commit_enabled: true          # observe_only 模式时设为 false

# MotionGate：静止检测和门控
motion_gate:
  enabled: true
  min_translation_m: 0.30      # 最小位移（米）
  min_rotation_deg: 3.0        # 最小旋转（度）
  min_time_between_keyframes_sec: 2.0  # 最小时间间隔（秒）

stationary_policy:
  enter_confirm_frames: 20
  enter_max_raw_increment_m: 0.015
  enter_max_speed_mps: 0.03
  position_hold_variance: 0.0025
  velocity_hold_variance: 0.001
  exit_confirm_frames: 3
  exit_min_increment_m: 0.02
  exit_cumulative_motion_m: 0.15
  exit_direction_cosine_min: 0.80
  exit_evidence_window_sec: 1.50
  exit_min_speed_mps: 0.01
  exit_force_anchor_drift_m: 0.30
  moving_confirm_timeout_sec: 1.50
  catch_up_max_step_m: 0.08
  catch_up_complete_error_m: 0.03
  catch_up_confirm_frames: 2

# Visualization continuity only. Safety validity and removal authorization
# continue to use current CargoBottom evidence without this hold.
cargo_marker:
  invalid_hold_sec: 2.0

# 关键帧 active window
online_cache:
  max_active_keyframes: 80     # 最大活跃关键帧数
  release_check_interval: 10   # 检查释放间隔（帧数）

# 磁盘增量保存
persistent_map:
  enabled: false  # fix/588-runtime-localization-stable: 验证时必须 false
  root_dir: "/home/ydkj/NDT-slam-ws/maps/live/current"
  tile_size_m: 20.0            # tile 大小（米）
  flush_interval_sec: 60       # flush 间隔（秒）
  max_dirty_tiles_in_memory: 20  # 最大 dirty tile 数量
  write_tmp_then_rename: true  # 先写临时文件再重命名
  tile_voxel_registration: 0.30
  tile_voxel_display: 0.10
  tile_voxel_ground: 0.15
  tile_voxel_objects: 0.08
  # `/display_map_persistent` is rebuilt from durable display tiles after
  # startup/flush. RViz uses this bounded overview; `/display_map_active`
  # remains the high-detail active window.
  persistent_display_voxel: 0.25
  persistent_display_max_points: 1500000
  persistent_display_refresh_sec: 30.0
  # Compatibility `/display_map`; RViz explicitly uses the persistent topic.
  # Allowed values: active_window, persistent_tiles.
  display_map_compat_scope: active_window

# 磁盘保护
disk_guard:
  enabled: true
  min_free_disk_gb: 50         # 最小空闲磁盘空间（GB）
  pause_mapping_when_low: true # 磁盘空间不足时暂停写入

# 内存保护（分级）
memory_guard:
  enabled: true
  soft_threshold_mb: 6000      # 6GB: 释放缓存 + flush dirty tiles
  soft_recover_mb: 5500
  hard_threshold_mb: 7000      # 7GB: 暂停地图 commit（NDT/TF 继续）
  hard_recover_mb: 6500
  emergency_threshold_mb: 8000 # 8GB: 降采样 active map
  emergency_recover_mb: 7200
  check_interval_sec: 30       # 每 30 秒检查一次

# Active map 重建策略
active_map:
  max_active_keyframes: 80
  rebuild_every_keyframes: 10
  registration_voxel: 0.30
  display_voxel: 0.10
  objects_voxel: 0.08

# 雷达断流检测
pointcloud_watchdog:
  stale_timeout_sec: 10.0

# Reject physically impossible LiDAR returns before NDT, tracking and map
# commit. Valid warehouse structures observed on this installation remain
# inside this sensor-frame vertical interval.
pointcloud_sanity:
  enabled: true
  minimum_z_m: -4.0
  maximum_z_m: 10.0

# NDT 健康监控
ndt_health:
  fitness_warning_threshold: 0.35
  fitness_warning_count: 5

# 天车运动约束（三自由度建图：x/y/yaw 自由，z/roll/pitch 锁定）
crane_motion_constraint:
  enabled: true
  lock_z: true                # z 锁定（天车雷达高度固定）
  fixed_z_source: "config"    # config: 使用 fixed_z 值; first_frame: 使用第一帧值
  fixed_z: 0.0                # 固定 z 值（map 坐标系下 base_link 高度）
  constrain_z: false          # 不使用限幅模式
  lock_roll: true             # roll 锁定（天车不翻转）
  lock_pitch: true            # pitch 锁定（天车不俯仰）
  lock_yaw: false             # yaw 不锁定（NDT 需要横向自由度）
  constrain_yaw: false        # v8-stable-r3-hotfix-minimal: 禁用 yaw 约束，交给 soft_yaw_filter
  max_abs_z_drift: 0.05       # z 最大允许漂移（仅 constrain_z=true 时生效）
  max_roll_deg: 0.3           # roll 最大允许漂移（度）
  max_pitch_deg: 0.3          # pitch 最大允许漂移（度）
  # max_yaw_deg: 1.0          # v8-stable-r3-hotfix-minimal: 已禁用，不再使用

# ========== 吊货过滤配置 ==========

# BasePayloadChannelFilter
base_payload_channel:
  enabled: true
  lateral_center: 0.0
  lateral_half_width: 3.0
  longitudinal_min: -10.0
  longitudinal_max: 10.0
  min_object_hag: 0.40
  min_payload_points: 20
  expand_xy: 0.5

# PayloadTrackManager
payload_tracker:
  enabled: true
  base_stability_std_thresh: 0.35

# DynamicEventManager
dynamic_event_manager:
  enabled: true
  payload_min_candidate_frames: 3
  payload_pre_guard_sec: 3.0
  moving_post_guard_sec: 2.0
  unknown_post_guard_sec: 5.0
  merge_same_track: true
  merge_time_gap_sec: 3.0
  merge_iou_thresh: 0.2
  max_active_sessions: 3
  placement_detection_enabled: true
  stable_window_sec: 4.0
  stable_frames_thresh: 5
  stable_map_disp_thresh_m: 0.15
  stable_velocity_thresh_mps: 0.04
  placed_bbox_expand_xy: 0.3
  placed_bbox_expand_z: 0.3
  clean_deny_enabled: true
  enable_cargo_history_clean: true
  enable_human_history_clean: true

# ========== 人体过滤配置 ==========

human_object_filter:
  enabled: true
  min_hag: 0.15           # P1: 降低到 0.15m
  max_hag: 2.30
  min_cluster_height: 0.40  # P1: 降低到 0.40m
  max_cluster_height: 2.20
  min_points: 5             # P1: 降低到 5，捕获弱小簇
  max_points: 500           # P1: 降低到 500
  min_area_m2: 0.04
  max_area_m2: 1.20
  max_width_m: 1.20         # P1: 降低到 1.20
  max_length_m: 1.20        # P1: 降低到 1.20
  bev_resolution: 0.10
  merge_gap_m: 0.15

  # P1: 区分 strong/weak 的阈值
  min_points_strong: 30     # >= 30 points: strong human/dynamic，直接删除
  min_points_weak: 5        # 5-30 points: weak transient，禁止进入地图

  # P1: deny history 配置
  human_deny_ttl: 15.0      # 人员 deny cells 保留 15 秒

# HumanObjectTracking（人体跟踪）
human_object_tracking:
  enabled: true
  window_sec: 2.0
  confirm_frames: 2
  map_displacement_thresh_m: 0.20
  velocity_thresh_mps: 0.10
  max_match_distance_m: 0.80
  max_missed_frames: 5

# HumanObjectEraser（人体历史反删）
human_object_eraser:
  enabled: true
  history_sec: 10.0
  capsule_radius_m: 0.65
  use_track_height_range: true
  z_margin_m: 0.30
  hag_margin_m: 0.30
  pre_guard_sec: 2.0
  post_guard_sec: 3.0
  erase_objects_only: true
  erase_ground: false
  async_update: true

# ========== CargoBoxEstimator 配置 ==========
cargo_box_estimator:
  enabled: true

  # 聚类参数
  min_cluster_points: 40
  max_cluster_points: 20000

  # BEV 连通域参数
  bev_resolution: 0.10
  bev_min_points_per_cell: 1
  bev_min_component_cells: 2
  bev_connectivity: 8

  # 悬空主体层检测
  min_hag_for_candidate: 0.20
  min_payload_bottom_hag: 0.45
  z_hist_bin: 0.10
  min_z_band_points: 3
  dense_bin_ratio: 0.15
  dense_bin_min_points: 2

  # P0-5: 分阶段阈值（locked track 下使用更宽松的阈值）
  locked_min_core_points: 4
  locked_min_z_band_points: 2
  use_last_good_box_fallback: true
  fallback_hold_time_sec: 1.2
  min_dense_band_height: 0.10
  max_dense_band_height: 3.50

  # Commit D: V2_CORE 质量门
  visual_min_long_side: 0.50
  visual_min_short_side: 0.25
  visual_min_height: 0.30
  visual_min_area_xy: 0.25
  visual_max_long_side: 8.0
  visual_max_short_side: 5.0
  visual_max_height: 3.0
  visual_min_core_points: 12
  track_switch_confirm_frames: 3
  track_switch_max_jump_m: 1.20
  selected_track_hold_sec: 1.20

  # 分位数参数
  xy_percentile_low: 2.0
  xy_percentile_high: 98.0
  z_percentile_low: 5.0
  z_percentile_high: 98.0

  # 轴向约束 OBB
  use_crane_axis_obb: true

  # 尺寸限制
  max_width: 6.0
  max_length: 16.0
  max_height: 5.0

  # 显示框扩展（core box）
  core_expand_xy: 0.05
  core_expand_z_down: 0.03
  core_expand_z_up: 0.10

  # 删除框扩展（remove box）
  remove_expand_xy: 0.25
  remove_expand_z_down: 0.05
  remove_expand_z_up: 0.20

  # 禁行区扩展
  forbidden_expand_xy: 0.50
  forbidden_height: 3.0

  # 尺寸增长率限制（防止框体突然变大）
  max_size_growth_ratio: 1.35

  # 最小悬空高度（不能作为吊货的最低 HAG）
  min_suspended_hag: 0.35

  # 最小 core points
  min_core_points: 5

  # P0-6: 候选/确认两级阈值
  min_candidate_core_points: 5
  min_confirm_core_points: 25
  min_update_core_points: 8
  min_confirm_observed_frames: 3

  # 绝对尺寸约束
  max_core_length: 12.0
  max_core_width: 4.0
  max_core_height: 4.0
  min_core_length: 0.30
  min_core_width: 0.30
  min_core_height: 0.10

  # 初始化质量约束
  init_max_area: 30.0
  init_max_aspect_ratio: 8.0
  init_min_bottom_hag: 0.45
  init_min_core_points: 5

# ========== v8-stable-r3-final: CraneMotionEKF ==========
crane_motion_ekf:
  enabled: true
  source: "estimated"          # estimated / plc

  q_pos: 0.05
  q_vel: 0.30

  r_ndt_base: 0.02
  r_ndt_max: 2.0
  fitness_to_r_scale: 5.0

  innovation_gate_m: 0.35
  innovation_reject_m: 1.00
  # Fitness depends on target density.  Inflate EKF R instead of using a
  # binary reject cliff; innovation/NIS and the output invariant remain active.
  reject_high_fitness: false
  ndt_fitness_reject_threshold: 2.00
  ndt_fitness_recover_threshold: 0.12

  max_speed_x: 2.0
  max_speed_y: 2.0
  max_accel_x: 1.5
  max_accel_y: 1.5

  commit_requires_ndt_accept: true
  map_commit_max_fitness: 2.0
  max_rejected_frames_for_commit: 0

  diagonal_mode:
    # Independent axes allow a second trolley axis to start without being
    # damped as a lateral outlier relative to the previous velocity vector.
    axis_independent_gate: true
    enabled: false
    nis_reject_threshold: 13.82
    min_vx: 0.05
    min_vy: 0.05
    min_speed: 0.10
    lateral_gate_m: 0.20
    tangential_gate_m: 0.40
    lateral_damping: 0.70
    tangential_damping: 0.40

  recovery:
    max_frames_since_good_ndt: 30
    max_high_fitness_frames: 10
    max_reject_innovation_frames: 5
    high_fitness_threshold: 0.15

  # V3: 慢帧保护
  ndt_runtime_guard:
    enabled: true
    warn_ms: 100.0
    emergency_ms: 120.0
    slow_extra_r: 0.30

  # V3: 物理步长保护
  crane_motion_limit:
    max_speed_mps: 2.00
    max_step_safety_factor: 1.10
    max_step_min_m: 0.05
    max_step_max_m: 0.25

# ========== v8-stable-r3-final: SoftYawFilter ==========
soft_yaw_filter:
  enabled: true
  mode: "soft_filter"

  alpha_stationary: 0.04
  alpha_moving: 0.18
  alpha_speed_extra: 0.05

  max_step_deg_stationary: 0.08
  max_step_deg_moving: 0.35

  warn_raw_filtered_diff_deg: 3.0

# ========== v8-stable-r3-final: Registration Input ==========
registration_input:
  static_object_voxel_size: 0.22
  uncertain_candidate_voxel_size: 0.30
  ground_grid_cell_m: 0.50
  ground_edge_height_change_m: 0.08
  static_object_repeat: 2
  uncertain_candidate_repeat: 1
  ground_max_fraction: 0.35
  min_static_object_points: 600
  min_structure_xy_cells: 40
  min_registration_points: 2500
  target_registration_points: 4000
  max_ndt_points: 6000
  allow_full_ground_fallback: false

ndt_observability:
  enabled: true
  moderate_ratio: 0.20
  severe_ratio: 0.08
  moderate_weak_inflation: 5.0
  severe_weak_inflation: 20.0
  min_structure_points: 600
  min_occupied_cells: 40
  min_local_normals: 80
  max_normal_samples: 800
  local_neighbor_count: 10
  occupancy_cell_m: 0.50
  min_xy_span_m: 2.0
  normal_search_radius_m: 0.90
  min_normal_anisotropy: 0.20

# ========== V3: Localization Target ==========
localization_target:
  enabled: true              # legacy: maps to build_enabled
  build_enabled: true        # continue building target in shadow mode
  use_for_ndt: false         # PRODUCTION DEFAULT: do NOT bind unvalidated target to NDT
  use_objects_only_initial: true
  include_ground_edge: false
  min_points: 3000
  max_points: 60000
  voxel_size: 0.30

  # Cropped cached target
  crop_enabled: true
  radius_x: 15.0
  radius_y: 7.0
  update_distance_m: 0.50
  update_yaw_deg: 2.0
  update_min_interval_frames: 3

# ========== v8-stable-r3-final: Adaptive NDT ==========
adaptive_ndt:
  enabled: true
  target_total_ms: 80.0
  emergency_total_ms: 120.0

  normal:
    max_iterations: 30
    ndt_input_voxel_size: 0.30
    ground_sample_ratio: 0.20
    object_weight_repeat: 2
    max_ndt_points: 8000

  overload:
    max_iterations: 20
    ndt_input_voxel_size: 0.35
    ground_sample_ratio: 0.10
    object_weight_repeat: 1
    max_ndt_points: 6000

  emergency:
    max_iterations: 15
    ndt_input_voxel_size: 0.40
    ground_sample_ratio: 0.05
    object_weight_repeat: 1
    max_ndt_points: 4000

# ========== v8-stable-r3-final: ICP Refine ==========
icp_refine:
  enabled: false
  run_after_ndt: true
  use_objects_only: true
  max_iterations: 8
  max_correspondence_distance: 0.20
  transformation_epsilon: 0.002
  min_object_points: 800
  max_icp_ms: 15.0
  max_fitness: 0.50

# ========== v8-stable-r3-final: Debug Publish ==========
debug_publish:
  enabled: false
  publish_every_n_frames: 10

# ========== v8-stable-r3-final: RViz Publish ==========
rviz_publish:
  display_map_rate_hz: 1.0
  objects_clean_rate_hz: 1.0
  current_cloud_rate_hz: 3.0

# ========== HookFixedCargoDetector ==========
# Hook load voltage is classified by hook_load_state_node and consumed by the
# SLAM cargo lifecycle through the typed /hook/load_state topic.
hook_load_signal:
  enabled: true
  role: "auxiliary"
  # Legacy compatibility only; role is authoritative when present.
  required: false
  topic: "/gravity"
  state_topic: "/hook/load_state"
  publish_hz: 10.0
  low_threshold_v: 1.90
  high_threshold_v: 2.10
  hysteresis_v: 0.03
  confirm_samples: 2
  # Reject short LOADED/EMPTY pulses even if upstream sampling becomes faster.
  # Both this duration and confirm_samples must pass.
  minimum_transition_duration_sec: 0.50
  stale_timeout_sec: 2.50
  # After stale_timeout, retain the last EMPTY/LOADED state as fresh=false.
  # The total UNKNOWN transition is stale_timeout + this grace duration.
  held_stale_timeout_sec: 5.00
  consumer_timeout_sec: 3.00
  valid_voltage_min_v: 0.0
  valid_voltage_max_v: 6.0
  diagnostic_disconnect_sec: 10.0
  # Only independent, localization-valid LiDAR detection frames can confirm
  # the no-cargo state. Rate-limited frames and heartbeat ticks never count.
  lidar_empty_confirm_frames: 3
  formal_removal_max_age_sec: 0.80

cargo_safety:
  level1_distance_m: 3.0
  level2_distance_m: 5.0
  minimum_vertical_clearance_m: 0.80
  obstacle_bottom_percentile: 0.05
  obstacle_vertical_bin_size_m: 0.10
  obstacle_min_vertical_continuity_ratio: 0.45
  overhead_separation_margin_m: 0.10
  minimum_roi_coverage_ratio: 0.05
  maximum_obstacle_cloud_age_sec: 0.50
  # 17/18 need three independent, spatially continuous obstacle clusters.
  # Sparse/jumping returns remain fail-safe evidence-invalid (34). A confirmed
  # hazard is released only after two fresh CLEAR evaluations.
  hazard_confirm_frames: 3
  clear_confirm_frames: 2
  # 20 points only keep a diagnostic candidate identity. Phase one authorizes
  # formal 17/18 only for a large, independently proven static cargo stack.
  minimum_hazard_cluster_points: 20
  maximum_evidence_gap_sec: 0.60
  maximum_centroid_step_m: 0.75
  maximum_distance_step_m: 0.75
  maximum_clearance_step_m: 0.75
  obstacle_track_association_distance_m: 0.75
  obstacle_track_association_top_step_m: 0.75
  # Permit one 0.25 m cell of cluster-boundary jitter. Exact overlap and
  # centroid prediction still win the cost; this only preserves identity for
  # adjacent fragments of the same physical obstacle.
  obstacle_track_association_neighbor_cell_radius: 1
  # Large warehouse stacks retain identity by stable map-frame occupied cells,
  # even when their visible centroid changes with viewpoint.
  static_track_cell_overlap_min: 0.20
  static_track_iou_min: 0.10
  # OUTSIDE_CARGO_SHELL_ONLY is diagnostic. A static stack can become
  # independent only after the cargo moves while the stack stays on the same
  # map cells (or when a future map/pre-cargo source explicitly proves it).
  static_provenance_min_cargo_motion_m: 0.30
  obstacle_track_stale_sec: 1.00
  # A cluster born already inside the cargo footprint is normally residual
  # cargo self-points. It cannot warn until the same track was first observed
  # outside this band, unless authoritative static provenance proves it.
  embedded_obstacle_distance_threshold_m: 0.05
  # Code 17 requires the same track to complete confirmation outside 3 m.
  # At the configured operating speed the 7 m acquisition path establishes
  # this history before the real 5 m/code-18 and 3 m/code-17 boundaries.
  require_far_field_history_for_level1: true
  require_static_cargo_for_warning: true
  static_cargo_min_voxel_points: 80
  # Disabled until the upstream merged-cloud message carries an honest raw
  # return count; never synthesize a raw count from voxelized points.
  static_cargo_min_raw_equivalent_points: 0
  static_cargo_min_xy_area_m2: 0.50
  static_cargo_min_long_side_m: 0.80
  static_cargo_min_height_span_m: 0.40
  static_cargo_min_occupied_cells: 12
  # Authoritative map/pre-cargo provenance needs only three fresh LiDAR
  # confirmations. A previously unmapped fixed obstacle uses the stricter
  # five-frame, 0.8 s persistence gate.
  known_static_confirm_frames: 3
  static_cargo_confirm_frames: 5
  static_cargo_confirm_sec: 0.8
  obstacle_track_static_velocity_mps: 0.08
  # Long-term static evidence is built only from the clean objects stream
  # after Human/Cargo/swept-volume removal. Safety performs a bounded cell
  # lookup against an immutable snapshot; it never scans tiles per frame.
  static_map_cell_size_m: 0.25
  static_map_minimum_observations: 4
  static_map_minimum_stable_duration_sec: 1.0
  static_map_minimum_cell_overlap: 0.60
  static_map_minimum_iou: 0.45
  static_map_minimum_height_overlap: 0.50
  static_map_height_tolerance_m: 0.10
  static_map_minimum_matched_cells: 6
  static_map_maximum_query_area_cells: 4096
  static_map_pre_cargo_sequence_gap: 2
  # Static observations advance only after asynchronous map maintenance.
  # Large-warehouse revisits may be minutes apart. Immature observations inside
  # this window accumulate normally; older evidence is halved instead of being
  # discarded. NOT_IN_VIEW never adds stable time and an observed-free cell is
  # still invalidated immediately. Mature cells do not expire by wall time.
  static_map_immature_max_observation_gap_sec: 300.0
  static_map_immature_gap_retention_ratio: 0.50
  static_map_max_sequence_gap: 1
  # Sparse 2.5D+ height field. Only mature/approved cells enter formal use.
  static_height_z_bin_m: 0.10
  static_height_max_layers_per_cell: 3
  static_height_min_points_per_layer: 6
  static_height_maximum_merge_gap_m: 0.18
  # Clear 14 requires live ROI coverage plus a reliable static contract.
  fusion_minimum_live_coverage_for_clear: 0.05
  # Enable positive-only warnings only after identity, external-obstacle,
  # provenance, geometry and confidence evidence all pass. This path can
  # publish 17/18 but never CLEAR; legacy_any_pending must never be used.
  fusion_pending_warning_promotion_policy: evidence_backed_only
  fusion_pending_minimum_authority_confidence: 0.55
  # Code 29 is a bounded operator-review episode, never a normal warning.
  # Two distinct sensor frames are required; one episode lasts at most 1.5 s
  # and the same evidence identity cannot immediately re-enter after timeout.
  anomaly_review_enter_confirm_frames: 2
  anomaly_review_maximum_episode_sec: 1.50
  anomaly_review_same_episode_rearm_sec: 2.00
  # Track low-clearance obstacles before they enter the warning shell:
  # directionally when motion is authoritative, radially while stationary or
  # motion is unavailable. Acquisition never changes the 5 m/3 m thresholds
  # and cannot itself publish 17/18.
  collision_tracking_acquisition_distance_m: 8.0
  # Compatibility kill switch only. true enables the typed policy above but
  # cannot bypass any of its evidence gates.
  fusion_provisional_warning_to_official_code: true
  motion_corridor_enabled: true
  motion_corridor_immediate_near_field_m: 0.30
  # 8/5 data shows controlled crane creep at 0.03--0.11 m/s. Accept 0.03 m/s
  # only when the NDT/EKF velocity is current and measurement-backed.
  motion_corridor_minimum_speed_mps: 0.03
  motion_corridor_prediction_horizon_sec: 3.0
  motion_corridor_minimum_prediction_distance_m: 8.0
  # Running-path sector: forward 90 degrees (45 degrees on each side).
  motion_corridor_forward_half_angle_deg: 45.0
  motion_corridor_lateral_margin_m: 0.30
  motion_corridor_rear_margin_m: 0.30
  motion_corridor_velocity_alpha: 0.35
  motion_corridor_maximum_velocity_sample_gap_sec: 0.80
  # Every cluster inside the complete 0.30 m cargo boundary/uncertainty shell
  # requires identity-motion or independent static-map provenance.
  residual_validation_shell_min_m: 0.30
  residual_minimum_inside_xy_ratio: 0.60
  residual_minimum_identity_match_ratio: 0.35
  residual_minimum_surface_band_ratio: 0.50
  residual_minimum_motion_match_score: 0.70
  residual_surface_band_below_m: 0.60
  residual_surface_band_above_m: 0.20
  # Confirmed 17/18 warnings remain immediately visible and repeat every 5 s.
  # Non-authoritative pending evidence is summarized at low frequency.
  safety_console_period_sec: 5.0
  safety_pending_error_sec: 5.0

status_codes:
  clear: 14
  level1: 17
  level2: 18
  anomaly_review: 29
  system_not_ready: 30
  localization_invalid: 31
  gravity_invalid: 32
  cargo_invalid: 33
  obstacle_invalid: 34
  internal_error: 35

# Conservative identity-free envelope. It can discover positive hazards but
# never authorizes clear, cargo point removal, or a map commit.
pending_cargo_envelope:
  # Visual-only fallback when no physical shape has been measured. It is not a
  # minimum floor for LiDAR/retired/static shapes and cannot authorize 17/18.
  # Small-cargo display/query fallback for a LOADED lifecycle before a
  # reliable physical shape is available. Large cargo is expected to retain
  # measured/retired geometry. This identity-free source remains provisional:
  # it cannot authorize CLEAR, map removal, MapCommit, or positive 17/18.
  configured_length_m: 1.5
  configured_width_m: 1.0
  configured_height_m: 1.0
  # base_link Z is upward: cargo_center_z = hook_anchor_z + this offset.
  # A suspended cargo envelope is centered below the hook, hence negative.
  configured_center_offset_z_m: -1.50
  horizontal_margin_m: 0.20
  vertical_margin_m: 0.15
  maximum_candidate_age_sec: 0.50
  maximum_retired_age_sec: 8.0
  # Weak but associated LiDAR geometry is retained per provisional track.
  # Expansion is immediate but rate bounded; shrink is deliberately slower.
  candidate_shape_hold_sec: 3.0
  candidate_shape_growth_rate_mps: 0.30
  candidate_shape_shrink_rate_mps: 0.05
  maximum_fallback_sway_offset_m: 0.80
  # Lost-position growth is enabled only in LOST_HOLD and is measured from
  # the last reliable pose. LOADED duration never drives this value.
  lost_position_uncertainty_per_sec: 0.15
  maximum_lost_position_uncertainty_m: 1.00

cargo_presence:
  gravity_stale_hold_sec: 3.0

cargo_physical_motion:
  enabled: true
  external_state_topic: "/crane/base_motion_state"
  external_state_timeout_sec: 0.50
  enter_stationary_speed_mps: 0.03
  exit_stationary_speed_mps: 0.08
  enter_stationary_confirm_sec: 0.50
  exit_stationary_confirm_sec: 0.20
  maximum_sample_gap_sec: 0.50
  confidence_decay_tau_sec: 0.25
  minimum_valid_confidence: 0.35
  maximum_physical_speed_mps: 3.0
  maximum_raw_pose_innovation_m: 0.75
  velocity_filter_alpha: 0.30

pending_cargo_self_evidence:
  minimum_identity_confidence: 0.55
  minimum_shape_confidence: 0.55
  point_match_radius_m: 0.10
  maximum_candidate_age_sec: 0.50
  maximum_retired_age_sec: 8.0

static_origin_component:
  neighbor_height_center_tolerance_m: 0.18
  neighbor_interval_gap_tolerance_m: 0.12
  maximum_support_height_difference_m: 0.18
  maximum_component_cells: 4096
  # Three connected 0.25 m cells retain at least 18 layer points and cover
  # the observed small-cargo footprint. Every cell must still be temporally
  # mature, and runtime origins must predate the active cargo lifecycle.
  minimum_component_cells: 3
  maximum_anchor_distance_m: 2.0
  minimum_candidate_overlap: 0.15

# Independent EMPTY-state pickup baseline. It reads only authoritative
# map-frame top/support layers while localization is healthy. A component that
# is already mature and predates the cargo lifecycle may also be sampled while
# moving; its identity/generation/geometry still must remain stable. Odom Z is
# deliberately excluded from thickness estimation.
cargo_preload_baseline:
  allow_moving_mature_static: true
  minimum_confirm_frames: 5
  window_frames: 8
  maximum_observation_gap_sec: 0.5
  maximum_center_step_m: 0.35
  maximum_thickness_step_m: 0.25
  maximum_thickness_mad_m: 0.10
  maximum_size_relative_step: 0.30
  maximum_anchor_component_distance_m: 0.50
  # Reject the sparse 3-cell pickup components seen in the 8/3-8/4 run.
  # Insufficient static coverage falls back to POSITIVE_ONLY live geometry.
  minimum_occupied_cells: 6
  maximum_component_uncertainty_m: 0.20

cargo_lift_origin:
  enabled: true
  maximum_anchor_distance_m: 2.0
  minimum_significant_change_m: 0.15
  significance_sigma: 3.0
  minimum_source_coverage: 0.35
  minimum_top_coverage: 0.20
  minimum_revealed_support_coverage: 0.25
  lift_confirm_frames: 4
  thickness_confirm_frames: 5
  maximum_observation_gap_sec: 0.5
  maximum_source_age_sec: 0.5
  minimum_height_m: 0.30
  maximum_height_m: 5.00

cargo_geometry_fusion:
  # Stable live bounds may freeze a positive-only geometry when the static
  # baseline is unavailable or conflicts with the visible LiDAR extent. This
  # path can emit 17/18 but never authorizes CLEAR/removal/MapCommit.
  allow_positive_only_without_static_baseline: true
  positive_only_uncertainty_floor_m: 0.25
  allow_positive_only_on_source_conflict: true
  positive_only_confirm_frames: 5
  minimum_confirm_frames: 5
  # Five good dimension observations are required inside the latest eight;
  # a single partial scan no longer erases the whole same-track window.
  shape_confirmation_window_frames: 8
  # Freeze the median footprint only when the recent dimensions are compact.
  maximum_initial_dimension_mad_m: 0.30
  maximum_observation_gap_sec: 0.5
  maximum_source_disagreement_m: 0.25
  maximum_fused_uncertainty_m: 0.20
  minimum_height_m: 0.30
  # Use the same physical height ceiling as odom_anchored_cargo_box so live
  # bottom/fusion paths cannot bypass max_size_z.
  maximum_height_m: 2.00
  huber_delta_m: 0.20
  configured_bottom_margin_m: 0.10
  conservative_shrink_confirm_frames: 8
  maximum_shrink_per_frame_m: 0.03
  # Frozen cargo dimensions are lifecycle-stable. A larger observation must
  # be high confidence and persist continuously; a single merged component
  # can no longer inflate the formal safety envelope.
  immediate_expand_enabled: false
  conservative_expand_confirm_frames: 8
  minimum_live_shape_confidence_for_expand: 0.85
  minimum_live_dimension_support: 30
  # Initial positive-warning geometry is already protected by current cargo
  # identity and 5/8 temporal consistency. Frozen shrink remains stricter.
  minimum_initial_shape_confidence: 0.55
  minimum_live_shape_confidence_for_shrink: 0.75
  minimum_physical_length_m: 0.30
  minimum_physical_width_m: 0.20
  # Formal geometry starts from the multi-frame measured shape. The configured
  # fallback remains pending-only and must not inflate a physically confirmed
  # cargo into a false obstacle query.
  formal_transition_start_length_m: 0.30
  formal_transition_start_width_m: 0.20
  configured_fallback_is_formal_floor: false

cargo_recognition:
  enabled: true
  loaded_grace_sec: 1.0
  recognition_timeout_sec: 8.0
  publish_text_marker: true
  text_marker_z_m: 3.90

# Initial commissioning values; they are not asserted as industry standards.
cargo_swing:
  enabled: true
  hook_anchor_source: "config"
  hook_anchor_topic: "/crane/hook_anchor_base"
  hook_anchor_timeout_sec: 0.50
  hook_anchor_z_m: 3.50
  configured_hook_anchor_xy_authoritative: false
  configured_hook_anchor_z_authoritative: false
  topic_hook_anchor_xy_authoritative: true
  topic_hook_anchor_z_authoritative: true
  hoist_state_topic: "/crane/hoist_motion_state"
  hoist_state_timeout_sec: 0.50
  configured_sling_length_m: 1.00
  minimum_rope_length_m: 0.30
  minimum_valid_observation_sec: 0.50
  maximum_observation_gap_sec: 0.30
  history_window_sec: 4.00
  stationary_settle_delay_sec: 0.30
  measurement_filter_alpha: 0.35
  normal_angle_deg: 2.0
  warning_angle_deg: 3.0
  alarm_angle_deg: 5.0
  immediate_alarm_angle_deg: 7.0
  warning_offset_m: 0.20
  alarm_offset_m: 0.50
  immediate_alarm_offset_m: 0.70
  normal_speed_mps: 0.15
  warning_speed_mps: 0.30
  sway_end_angle_deg: 1.0
  sway_end_speed_mps: 0.10
  sway_end_confirm_sec: 2.0
  minimum_alarm_hold_sec: 0.50
  maximum_alarm_evidence_hold_sec: 0.30
  sway_end_offset_m: 0.10
  skew_suspect_angle_deg: 3.0
  skew_alarm_angle_deg: 5.0
  skew_suspect_offset_m: 0.20
  skew_alarm_offset_m: 0.50
  skew_immediate_offset_m: 0.70
  skew_direction_consistency: 0.80
  skew_min_dc_to_ac_ratio: 2.0
  skew_min_duration_sec: 1.00
  skew_alarm_confirm_sec: 0.50
  skew_alarm_hold_sec: 0.50
  skew_clear_confirm_sec: 1.00
  skew_clear_offset_m: 0.12
  skew_clear_direction_consistency: 0.55
  skew_max_zero_crossings: 1
  crossing_deadband_m: 0.03
  torsion_detect_deg: 3.0
  torsion_warning_deg: 5.0
  torsion_alarm_deg: 10.0
  torsion_warning_clear_deg: 3.0
  torsion_alarm_clear_deg: 6.0
  torsion_clear_confirm_sec: 1.00
  minimum_identity_confidence: 0.60
  minimum_shape_confidence: 0.55
  maximum_tracking_residual_m: 0.25
  minimum_orientation_confidence: 0.60
  minimum_torsion_aspect_ratio: 1.20
  allow_skew_alarm_without_hoist_up: false
  allow_configured_rope_length_alarm: false

# Clean-map maintenance receives a bounded owner-thread timeslice even when the
# latest-only localization queue remains continuously occupied. RViz map
# serialization runs on its own version-driven worker.
map_maintenance:
  interval_commits: 3
  max_deferral_frames: 5

hook_fixed_cargo_detector:
  enabled: true

  # 固定 ROI（base_link 坐标系）- 临时放宽，先确认能检测到
  roi_center_x: 0.0
  roi_center_y: -2.2
  roi_half_x: 2.2
  roi_half_y: 2.2
  roi_z_min: 0.10
  roi_z_max: 3.20

  # 检测参数 - 临时放宽，先确认能检测到
  voxel_leaf: 0.05
  cluster_tolerance: 0.30
  min_cluster_points: 5
  max_cluster_points: 10000

  # 过滤吊具/钢丝绳/上方结构 - 临时放宽，先确认能检测到
  reject_rope_radius: 0.03
  reject_rope_min_z: 3.5
  reject_structure_z: 4.5

  # 框稳定
  xy_mode: "roi_center"
  xy_alpha: 0.15
  z_alpha: 0.30
  size_alpha: 0.20

  # 尺寸门
  min_long_side: 0.30
  min_short_side: 0.20
  min_visible_height: 0.08
  max_long_side: 4.0
  max_short_side: 3.0
  max_height: 3.0

  # 底部估计
  bottom_min_points: 15
  visible_side_min_height: 0.30
  bottom_band_height: 0.10
  bottom_band_min_points: 5
  bottom_band_min_xy_cells: 2
  bottom_xy_cell_size: 0.10

  # 不确定性
  points_uncertainty: 0.12
  height_memory_uncertainty: 0.18
  invalid_uncertainty: 0.30
  stable_height_alpha: 0.25

  # 允许没有底部估计时也显示框
  allow_visible_box_without_bottom: true

# ========== HookCargoLock 状态机 ==========
hook_cargo_lock:
  enabled: true
  lock_confirm_frames: 3
  # Discovery is followed by an identity-aware provisional window. Formal
  # shape/yaw freezing cannot happen from orientation concentration alone.
  geometry_confirm_frames: 4
  size_init_window: 5
  # Gravity-confirmed cargo persists through short rotating/occluded views.
  # Five seconds retains the locked identity while uncertainty grows.
  lost_hold_sec: 5.0
  lost_clear_sec: 8.0
  strong_min_points: 30
  weak_min_points: 5
  size_change_min_ratio: 0.20
  size_change_max_ratio: 0.60
  size_update_confirm_frames: 5
  size_update_alpha: 0.15
  # A suspended cargo is a rigid body. Once lock confirmation finishes, keep
  # its base-relative box dimensions/height fixed until EMPTY or LOST_CLEAR.
  freeze_geometry_after_lock: true
  # The installation only permits horizontal/vertical cargo orientations.
  # A diagonal partial return may refine the provisional fit, but formal OBB
  # yaw is snapped to the nearest 0/90-degree axial direction at lock time.
  axis_aligned_yaw_after_lock: true
  # Freeze physical thickness, not absolute Z. The overhead LiDAR observes the
  # upper surface far more reliably than the occluded lower edge, so each
  # associated frame derives bottom_z = robust_top_z - frozen_thickness.
  freeze_vertical_position_after_lock: false
  track_vertical_from_top_surface: true
  # A top-derived formal bottom still requires fresh, associated physical
  # support. These gates reject isolated high returns without requiring the
  # overhead LiDAR to see the occluded lower edge.
  formal_top_min_support_points: 8
  formal_top_min_coverage_ratio: 0.02
  # Direct lower-edge points may corroborate the top-derived center only when
  # both estimates agree; otherwise the robust upper surface remains primary.
  top_bottom_center_agreement_m: 0.25
  candidate_hold_sec: 1.0
  candidate_max_weak_frames: 10
  # Short gaps stop progress but retain the already confirmed window.
  # candidate_progress_timeout_sec remains the sole stalled-window reset.
  candidate_window_frames: 12
  candidate_required_consistent_frames: 7
  # At the 5 Hz detector rate this tolerates a sub-second visibility gap.
  # Gap frames never count as lock evidence.
  candidate_max_gap_frames: 4
  candidate_progress_timeout_sec: 3.0
  candidate_absolute_timeout_sec: 8.0
  candidate_switch_confirm_frames: 3
  candidate_switch_margin: 0.08
  bottom_alpha_points: 0.30
  bottom_alpha_memory: 0.15
  loaded_reacquire_min_bottom_uncertainty_m: 0.12
  bottom_hold_uncertainty_growth: 0.02
  bottom_max_uncertainty: 0.35

  # locked association gate
  locked_update_max_center_dist: 0.65
  # A moving load is compared with both the filtered centre and this short,
  # displacement-bounded prediction. Frozen-shape point support is still
  # required, so this closes filter lag without widening identity globally.
  association_prediction_horizon_sec: 0.50
  association_prediction_max_displacement_m: 0.50
  locked_update_min_overlap_ratio: 0.30
  locked_update_max_z_jump: 0.45
  locked_update_max_top_jump: 0.60
  locked_update_min_points: 20
  minimum_identity_confidence: 0.62
  minimum_overall_lock_confidence: 0.68
  maximum_provisional_shape_cv: 0.20
  minimum_candidate_score_margin: 0.08
  suspension_confirm_frames: 3
  minimum_lift_from_origin_m: 0.25
  reacquisition_overlap_extra: 0.10
  residual_uncertainty_decay: 0.80
  live_pose_center_alpha: 0.45
  # Physical rate limits are sensor-dt based; the margin absorbs quantization
  # and association noise without imposing a frame-rate-dependent speed cap.
  live_pose_max_xy_speed_mps: 2.0
  live_pose_max_z_speed_mps: 1.5
  live_pose_step_margin_m: 0.05
  live_pose_velocity_alpha: 0.35
  # LOST_HOLD remains visible for lost_clear_sec, but formal safety/removal may
  # only use prediction/held evidence inside this short window.
  formal_xy_evidence_hold_sec: 2.00
  formal_vertical_evidence_hold_sec: 2.00
  direct_bottom_soft_stale_sec: 2.00
  velocity_model_uncertainty_mps: 0.05
  # LOST_HOLD grows from the strict 0.55 m gate toward this bounded ceiling
  # using accumulated position uncertainty. OBB support and frozen-shape
  # checks remain mandatory, so the wider gate is not a nearest-cluster jump.
  association_max_xy_gate_m: 1.05
  reacquisition_max_xy_gate_m: 0.55
  association_max_z_gate_m: 0.90
  reacquisition_max_z_gate_m: 0.65
  locked_obb_min_support_ratio: 0.30
  locked_obb_min_long_axis_coverage: 0.12
  locked_obb_min_short_axis_coverage: 0.12
  lost_velocity_decay_tau_sec: 0.30
  rearm_empty_confirm_sec: 1.0
  # A process that remains LOADED can reuse only the retired formal signature;
  # it must pass this separate multi-frame identity/geometry gate.
  loaded_reacquire_confirm_frames: 3
  self_cargo_base_margin_xy_m: 0.15
  self_cargo_base_margin_z_m: 0.12
  self_cargo_max_margin_xy_m: 0.40
  self_cargo_max_margin_z_m: 0.30
  # The merged input uses 0.15 m voxels. Match at that same scale, but only
  # inside the current/previous/swept OBB neighborhood; this closes voxel
  # centroid jitter without deleting nearby external obstacles globally.
  self_cargo_point_match_radius_m: 0.15
  # A narrow line mask follows the suspension path from cargo top to the
  # configured hook anchor; it removes rope/hook returns, not a broad volume.
  self_rigging_radius_m: 0.10
  lost_position_uncertainty_per_sec: 0.05
  lost_position_uncertainty_max_m: 0.50

  # 锁定时 strong 条件（比更新时更严格）
  lock_strong_min_points: 80
  lock_min_visible_height: 0.50
  lock_min_xy_area: 0.40
  lock_max_center_step_m: 0.30
  compact_lock_enabled: true
  compact_min_points: 40
  compact_min_visible_height: 0.18
  compact_min_xy_area: 0.12
  compact_confirm_frames: 5
  compact_max_size_relative_step: 0.25
  # Gravity EMPTY may keep a pre-lift candidate, but cannot lock until the
  # LiDAR bottom is this far above the external ground reference.
  suspended_min_ground_clearance_m: 0.30

  # locked search margin
  locked_search_margin_x: 0.30
  locked_search_margin_y: 0.30

  # 启用吊物点云去除
  enable_hook_cargo_removal: true

# ========== OdomAnchorBox 配置 ==========
odom_anchored_cargo_box:
  enabled: true

  # 绿色框中心锚点（默认 base_link/odom 原点）
  anchor_x: 0.0
  anchor_y: 0.0

  # 检测和 marker 降频
  detect_rate_hz: 5.0
  marker_rate_hz: 5.0

  # debug 点云发布（默认关闭）
  publish_debug_points: false
  publish_selected_core_points: false
  publish_raw_candidate_points: false
  publish_default_box_marker: false

  # 日志控制
  verbose_debug: false
  summary_log_period: 2.0

  # 旧 cargo 链路开关（默认关闭）
  use_global_payload_tracker: false
  use_cargobox_v2: false
  use_dynamic_history_eraser: false

  # 检测窗口围绕 anchor 裁剪
  search_half_x: 1.20
  search_half_y: 1.20
  search_z_min: 0.05
  search_z_max: 3.20

  # 默认小参考框（仅 debug）
  default_size_x: 0.50
  default_size_y: 0.35
  default_size_z: 0.25

  # 检测到货物后的尺寸范围
  # Match the compact-cargo physical contract (minimum area/points still
  # apply); do not reject a 30x20 cm footprint before compact confirmation.
  min_size_x: 0.30
  min_size_y: 0.20
  min_size_z: 0.20
  # Retain long-load support while rejecting the observed 3.72-3.90 m
  # first-frame mixtures at the formal/pending clamped-footprint gate.
  max_size_x: 3.50
  # Server observations repeatedly measured 1.61-1.85 m wide cargo. The old
  # 1.60 m cap clipped every such footprint and destabilized aspect/identity
  # confirmation; point, area, confidence and multi-frame gates remain intact.
  max_size_y: 2.00
  max_size_z: 2.00

  size_margin_x: 0.10
  size_margin_y: 0.10
  size_margin_z: 0.05

  lock_confirm_frames: 2
  strong_min_points: 50
  weak_min_points: 10

  size_update_confirm_frames: 5
  size_change_min_ratio: 0.20
  size_change_max_ratio: 0.60
  size_update_alpha: 0.15

  bottom_alpha_points: 0.25
  bottom_alpha_hold: 0.05
  bottom_max_uncertainty: 0.35

  lost_hold_sec: 5.0
  lost_clear_sec: 15.0

  tight_box:
    enabled: true
    # Cargo XY is the hook/odom anchor. LiDAR controls yaw and symmetric size,
    # while its raw centre remains available for association/swing evidence.
    anchor_symmetry_mode: "strict"
    max_center_offset_m: 0.35
    hag_filter_enabled: true
    hag_min_m: 0.15
    hag_max_m: 2.50
    # Never use the payload ROI minimum as ground. Ground is accepted only
    # from a spatially distributed ring outside the payload crop.
    ground_ring_width_m: 2.0
    ground_cell_size_m: 0.50
    ground_min_cells: 4
    ground_min_points_per_cell: 3
    # Reject a geometrically one-sided ring. Three quadrants are preferred;
    # two directly opposite sides are also sufficient in narrow aisles.
    ground_min_quadrants: 3
    ground_allow_opposite_sides: true
    ground_max_range_m: 0.15
    # base_link is ground-referenced in this deployment. Reject a coherent
    # raised shelf/platform that would otherwise look like flat ground.
    ground_expected_height_enabled: true
    ground_expected_height_m: 0.0
    ground_max_expected_height_delta_m: 0.30
    # Only this many HAG residual points are treated as sensor noise. Any
    # larger unclustered residual keeps the cargo observation UNKNOWN.
    empty_max_hag_candidate_points: 2
    percentile_low: 0.08
    percentile_high: 0.92
    margin_xy_m: 0.05
    margin_z_m: 0.03
    size_update_mode: "adaptive"
    size_update_alpha: 0.30
    max_size_change_per_frame_m: 0.10
    # Identity selection and geometry must consume the same full component.
    sub_cluster_enabled: false
    sub_cluster_tolerance_m: 0.10
    sub_cluster_min_points: 20
    # Keep local Euclidean components conservative. Disconnected returns from
    # one long cargo are fused only by axial/z-overlap hypotheses.
    component_cluster_tolerance_m: 0.20
    component_merge_longitudinal_gap_m: 0.60
    component_merge_lateral_gap_m: 0.35
    component_merge_max_yaw_difference_deg: 15.0
    component_merge_min_z_overlap_ratio: 0.30
    # Reject the observed 3.81x0.25 m "line cargo" before it can win identity
    # ranking. Current measured warehouse loads remain below 2.6:1.
    component_max_hypothesis_aspect_ratio: 3.0
    # Merging may extend length but cannot erase the width already measured on
    # an individual fragment.
    component_merge_min_short_side_retention_ratio: 0.70
    component_merge_max_components: 3
    # Preserve the detected cargo's own footprint direction. Square/ambiguous
    # observations fall back to the conservative axis-aligned box.
    orientation_enabled: true
    orientation_min_points: 20
    orientation_min_geometric_aspect_ratio: 1.20
    orientation_min_eigenvalue_ratio: 1.44
    orientation_min_concentration: 0.70
    orientation_min_confirm_frames: 3
    orientation_max_yaw_spread_deg: 12.0

  cargo_warning:
    enabled: true
    publish_alarm_msg: false
    publish_debug_marker: true
    level1_distance_m: 3.0
    level2_distance_m: 5.0
    min_vertical_clearance_m: 0.80
    cargo_bottom_use_uncertainty: true
    cargo_bottom_extra_margin_m: 0.05
    obstacle_top_percentile: 0.95
    obstacle_min_points: 5
    obstacle_cluster_tolerance_m: 0.25
    maximum_obstacle_cloud_age_sec: 0.50
    minimum_roi_finite_points: 20
    minimum_roi_coverage_ratio: 0.05
    exclude_ground: true
    ground_hag_min_m: 0.20
    exclude_self_cargo: true
    self_cargo_margin_xy_m: 0.45
    self_cargo_margin_z_m: 0.35
    debounce_frames: 2
    clear_hold_sec: 0.5
    level1_alarm_code: 17
    level2_alarm_code: 18
    clear_alarm_code: 14
