# Dual-lidar consume-once synchronization.
# Both clouds are rigidly transformed into base_link before they are merged.
output_topic: "/merged_points"
output_frame: "base_link"
diagnostics_topic: "/pointcloud_merger/diagnostics"
transform_to_base: true
use_voxel_filter: true
voxel_size: 0.15

sync:
  # The measured warehouse bag offset is about 48 ms. Keep this just above
  # that offset, and validate pair_dt_ms from the diagnostics topic on Ubuntu.
  max_pair_dt_sec: 0.060
  # A cloud is published alone only after this wall-clock wait. It is never
  # copied into the missing lidar slot.
  stale_timeout_sec: 0.120
  # The timer only selects/consumes work; PCL transform/filter work is lock-free.
  timer_period_sec: 0.010
  max_queue_size: 8
  subscriber_queue_size: 10
  diagnostic_log_period_sec: 2.0

lidars:
  - name: "lidar150"
    topic: "/rs_201"
    Lidar2BaseExtrinsic: [0.00154367, 0.0285239, 0.999592, 0.0, 0.0285239, 0.999185, -0.0285563, 0.0, -0.999592, 0.0285563, 0.000728802, 8.05956, 0.0, 0.0, 0.0, 1.0]
  - name: "lidar160"
    topic: "/rs_203"
    Lidar2BaseExtrinsic: [-0.00757349, -0.05798094, -0.99828896, -1.18970073, -0.02237139, -0.99805785, 0.05813725, 1.20057845, -0.99972101, 0.02277342, 0.00626166, 8.03784688, 0.0, 0.0, 0.0, 1.0]
