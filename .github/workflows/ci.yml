name: repository-and-catkin

on:
  push:
  pull_request:

jobs:
  noetic:
    runs-on: ubuntu-latest
    container: ros:noetic-ros-base-focal
    steps:
      - uses: actions/checkout@v4

      - name: Static repository contracts
        run: |
          python3 scripts/regression/check_yaml_duplicate_keys.py
          python3 scripts/regression/check_repository_integrity.py
          python3 scripts/regression/check_cargo_safety_e2e.py
          python3 -m compileall -q scripts src/ndt_slam/scripts

      - name: Install ROS build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-catkin-tools python3-rosdep
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro noetic -r -y

      - name: Clean catkin build
        shell: bash
        run: |
          source /opt/ros/noetic/setup.bash
          catkin config --extend /opt/ros/noetic --cmake-args -DCMAKE_BUILD_TYPE=Release
          catkin clean -y
          catkin build --no-status

      - name: Unit tests
        shell: bash
        run: |
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          catkin run_tests --no-status
          catkin_test_results --verbose
