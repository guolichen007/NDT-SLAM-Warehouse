name: 安全问题
description: 报告吊物避障安全相关问题
title: "[安全] "
labels: ["safety", "bug"]
body:
  - type: input
    id: sha
    attributes:
      label: 运行 SHA
      description: 出现问题的代码版本
      placeholder: "8d7d7ee"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、ROS 版本、硬件配置
    validations:
      required: true
  - type: input
    id: safety_code
    attributes:
      label: 安全码
      description: 出现问题的 Code（14/17/18/30-35）
    validations:
      required: true
  - type: textarea
    id: cargo_state
    attributes:
      label: 吊物状态
      description: 货物生命周期状态、几何来源（Formal/Degraded）、障碍 Track 状态
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志位置
      description: 日志文件路径或关键日志片段
  - type: input
    id: bag
    attributes:
      label: Bag 是否存在
      description: 是否可以提供复现所用的 bag 文件
  - type: checkboxes
    id: safety_impact
    attributes:
      label: 安全影响
      options:
        - label: 影响 Code 14（CLEAR）
        - label: 影响 Code 17/18（告警）
        - label: 涉及 Code 30-35（故障）
        - label: 影响了障碍物检测
        - label: 影响了吊物几何
  - type: input
    id: field_status
    attributes:
      label: 现场是否停止运行
      description: 该问题是否导致现场系统停用
