name: 功能请求
description: 建议新功能或改进
title: "[功能] "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: 功能描述
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 使用场景
      description: 在什么场景下需要这个功能
  - type: checkboxes
    id: impact
    attributes:
      label: 影响范围
      options:
        - label: 定位
        - label: 建图
        - label: 吊物安全
        - label: 监控/运维
        - label: 工程/CI
